[package]
name = "noargs"
version = "0.4.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Imperative command-line argument parser library with no dependencies, no macros, and no implicit I/O"
repository = "https://github.com/sile/noargs"
readme = "README.md"
categories = [ "command-line-interface" ]
include = ["/Cargo.toml", "/LICENSE*", "/README.md", "/examples/**/*.rs", "/src/**/*.rs", "/tests/**/*.rs"]

[dependencies]

[dev-dependencies]
noprop = "0.1"
